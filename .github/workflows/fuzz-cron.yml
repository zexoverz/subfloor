name: fuzz

on:
  schedule:
    # Every six hours. The counter on the showcase page is the sum of these runs, so the cadence is
    # the claim: a number that grew once before submission would be a screenshot, not a campaign.
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "Fuzz runs per suite"
        default: "26000"

permissions:
  contents: write

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: contracts/yarn.lock

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Restore forge build cache
        uses: actions/cache/restore@v4
        with:
          path: |
            contracts/out
            contracts/cache
          key: forge-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/yarn.lock') }}-${{ hashFiles('contracts/src/**/*.sol', 'contracts/test/**/*.sol', 'contracts/mocks/**/*.sol') }}
          restore-keys: |
            forge-${{ runner.os }}-${{ hashFiles('contracts/foundry.toml', 'contracts/yarn.lock') }}-

      - run: yarn install --frozen-lockfile
        working-directory: contracts

      - name: Run the campaign
        id: campaign
        env:
          # 26,000 per suite is 104,000 programs a campaign. Measured campaign time at 20,000 was
          # 2h21m, so this lands near 3h03m against a 300-minute timeout and a cadence whose
          # shortest observed gap was 4h18m. Raised from 20,000 on 10 Sep: at the old size the
          # counter reached ~1.94M by submission and the showcase copy says millions, which would
          # have been false by a hair. See #145.
          FUZZ_RUNS: ${{ github.event.inputs.runs || '26000' }}
        run: |
          set -o pipefail
          RESULT=$(./scripts/fuzz-campaign.sh)
          echo "$RESULT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      # A failed campaign is a counterexample. It must be loud, and it must not advance the counter.
      - name: Fail loudly on a counterexample
        run: |
          echo '${{ steps.campaign.outputs.result }}' | python3 -c "import json,sys; sys.exit(0 if json.load(sys.stdin)['ok'] else 1)"

      # A campaign takes tens of minutes, so main has usually moved by the time it finishes. The
      # first run lost 12,000 verified programs to exactly that: the count was right, the push was
      # rejected, and the job failed with nothing recorded. Rebase and retry rather than drop it.
      - name: Update the counter
        run: |
          python3 scripts/update-fuzz-counter.py '${{ steps.campaign.outputs.result }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fuzz-counter.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: fuzz campaign, cumulative counter"

          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "could not push the counter after 5 attempts" >&2
          exit 1
