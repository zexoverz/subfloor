[profile.default]
solc_version   = "0.8.30"
optimizer      = true
optimizer_runs = 700
via_ir         = true
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./config" },
    { access = "read", path = "./out" }
]

[fmt]
single_line_statement_blocks = "multi"
multiline_func_header        = "all"
override_spacing             = false
bracket_spacing              = true
int_types                    = "long"
number_underscore            = "thousands"

# Halmos cannot execute the `vm.deployCode` that dynamic test linking rewrites `new C(...)` into,
# so the symbolic profile turns it off. Everything else matches the default profile.
[profile.symbolic]
solc_version          = "0.8.30"
optimizer             = true
optimizer_runs        = 700
via_ir                = true
dynamic_test_linking  = false
# Halmos reads the solc AST; without this the artifacts are skipped and it reports "no tests".
ast                   = true
extra_output          = ["storageLayout"]

[profile.ci]
solc_version   = "0.8.30"
optimizer      = true
optimizer_runs = 700
via_ir         = true
