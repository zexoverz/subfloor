############################
##### Event-Level Data #####
############################

"""
An event is any user action that occurs in a protocol. Generally, they are Ethereum events
emitted by a function in the smart contracts, stored in transaction receipts as event logs.
However, some user actions of interest are function calls that don't emit events. For example,
the deposit and withdraw functions in Yearn do not emit any events. In our subgraphs, we still
store them as events, although they are not technically Ethereum events emitted by smart
contracts.
"""
type Swap @entity(immutable: true) @transaction {
  " { Transaction hash }-{ Log index } "
  id: Bytes!

  " Transaction hash of the transaction that emitted this event "
  hash: Bytes!

  " Nonce of the transaction that emitted this event "
  nonce: BigInt!

  " Event log index. For transactions that don't emit event, create arbitrary index starting from 0 "
  logIndex: Int!

  " Gas used in this transaction. (Optional because not every chain will support this) "
  gasUsed: BigInt

  " Gas limit of the transaction that emitted this event "
  gasLimit: BigInt

  " Gas price of the transaction that emitted this event "
  gasPrice: BigInt

  " The protocol this transaction belongs to "
  protocol: DexAggProtocol!

  " Account that emitted this event "
  account: Account!

  " Block number of this event "
  blockNumber: BigInt!

  " Timestamp of this event "
  timestamp: BigInt!

  " Virtual Pool this swap occurred in "
  virtualPool: VirtualPool!

  " Tokens deposited into pool "
  tokensIn: [Token!]!

  " Amount of tokens deposited into pool in native units "
  amountsIn: [BigInt!]!

  " Amount of tokens deposited into pool in USD "
  amountsInUSD: [BigDecimal!]!

  " Tokens withdrawn from pool "
  tokensOut: [Token!]!

  " Amount of tokens withdrawn from pool in native units "
  amountsOut: [BigInt!]!

  " Amount of tokens withdrawn from pool in USD "
  amountsOutUSD: [BigDecimal!]!
}

# Helper entity for calculating daily/hourly active users
type ActiveAccount @entity(immutable: true) {
  " { daily/hourly }-{ Address of the account }-{ Days/hours since Unix epoch } "
  id: Bytes!
}

# ---------------------------------------------------------------------------------------------
# SUBFLOOR extensions
#
# Everything above this line is schema-dex-agg.graphql v1.0.2, unmodified. Everything below hangs
# off it by id and never edits it, so a consumer who knows the standard can query this subgraph
# without reading our docs, and a consumer who wants the floor data joins one hop.
#
# See docs/indexer-schema.md for why, and in particular for why Refusal cannot come from a handler.
# ---------------------------------------------------------------------------------------------

" The worst rate a recipient will accept for a pair, as currently configured on chain. "
type Floor @entity(immutable: false) @regularPolling {
  " { recipient }-{ base }-{ quote } "
  id: Bytes!

  " The party protected. Keyed to the recipient, never chosen per order by the caller. "
  recipient: Bytes!

  " The token this recipient gives. "
  base: Token!

  " The token this recipient receives. "
  quote: Token!

  " Max adverse deviation from the reference, in bps. 10000 means only the backstop binds. "
  maxAdverseBps: Int!

  " Absolute backstop rate, scaled 1e18, that binds even when the oracle is wrong. "
  absoluteRate: BigInt!

  " Block and timestamp of the most recent change. "
  updatedAtBlock: BigInt!
  updatedAt: BigInt!

  " Full history, so the floor-setting screen can show what was signed and when. "
  changes: [FloorChange!]! @derivedFrom(field: "floor")
}

enum FloorChangeKind {
  " Strengthened by the recipient itself. One call, no signature. "
  RAISED
  " Weakened under a guardian signature. The one high-risk action. "
  LOWERED
}

type FloorChange @entity(immutable: true) @transaction {
  " { Transaction hash }-{ Log index } "
  id: Bytes!
  floor: Floor!
  kind: FloorChangeKind!

  oldMaxAdverseBps: Int!
  newMaxAdverseBps: Int!
  oldAbsoluteRate: BigInt!
  newAbsoluteRate: BigInt!

  " Set only on a LOWERED change. Null on a raise, because a raise needs no signature. "
  guardian: Bytes

  hash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

" How good a fill actually was, scored against the same reference the floor is scored against. "
type FillQuality @entity(immutable: true) @transaction {
  " The Swap id, so this is a one-hop join from the standard entity. "
  id: Bytes!
  swap: Swap!

  " The address that shipped the order. On a SUBFLOOR deployment this is the vault. "
  maker: Bytes!
  " The address that took the quote. "
  taker: Bytes!

  " Realised rate, received * 1e18 / given, from the **taker's** side. "
  executionRate: BigInt!

  """
  The same fill from the maker's side, which is the party this product protects.

  Settlement scores both: `checkSettlement` passes the taker recipient and the maker recipient
  separately, each against its own floor. The index used to compute only the taker's, which made the
  headline execution-quality number a statement about how well the counterparty did against the
  vault. On the live deployment it read +91 bps and looked like the vault doing well. It was the
  vault paying 91 bps through the reference.

  Approximate in one stated way: `Swapped` carries no fee breakdown, so this inverts the taker's
  amounts rather than reproducing `amountIn - feeIn` and `amountOut + feeOut`. Where the fee is
  charged in tokenIn the maker's realised rate is a little better than this says.
  """
  makerExecutionRate: BigInt!
  makerAdverseDeviationBps: Int!
  " The maker's floor at this block — the number a refusal would have been measured against. "
  makerFloorAtFill: BigInt

  " Chainlink reference at or before this block. "
  referencePrice: BigInt!

  """
  Age of that reference in seconds. A fill scored against a 20-minute-old reference is a weaker
  measurement than one scored against a 3-minute-old reference, and the daily report says so rather
  than averaging them together silently.
  """
  referenceAgeSeconds: Int!

  " Signed deviation from the reference in bps, taker side. Positive means the taker beat it. "
  adverseDeviationBps: Int!

  " The taker's floor at this block. Usually null — a taker that has not opted in has none, and most have not, which is why the old single `floorAtFill` was null on every row. "
  takerFloorAtFill: BigInt

  blockNumber: BigInt!
  timestamp: BigInt!
}

# `Refusal` used to be declared here, and nothing ever wrote it.
#
# It cannot be written: a refusal is a revert, a reverted transaction emits no logs, and a subgraph
# is driven by logs. An entity that can only ever be empty is worse than a missing one — a consumer
# querying `refusals` gets `[]` and reads it as "the floor has never had to hold", which is the exact
# opposite of what the empty list means. That is the headline number of this project, so the failure
# mode is not academic.
#
# Refusals are served by `/api/refusals`, which walks the router's transaction history through
# HyperSync, filters on status, and recovers each revert payload by replaying the call one block
# earlier. `indexer/substreams/` decodes the same thing from transaction status.


" Rolled up so the daily report is a query rather than a script that walks every fill. "
type ExecutionQualityDailySnapshot @entity(immutable: false) @dailySnapshot {
  " { Days since Unix epoch } "
  id: Bytes!
  protocol: DexAggProtocol!
  day: Int!

  fills: Int!
  refusals: Int!

  " Realised adverse deviation across the day's fills. The floor-setting screen reads these. "
  adverseDeviationP50Bps: Int!
  adverseDeviationP99Bps: Int!

  " Median age of the references used, so the report can say how fresh its own inputs were. "
  medianReferenceAgeSeconds: Int!

  timestamp: BigInt!
}

"""
The registry's own reference configuration for one ordered pair, read from the registry rather than
re-derived here.

It is a separate row per direction because the direction is the whole point. WETH/tUSDC is
registered with `inverted = false` and tUSDC/WETH with `inverted = true`, and the registry applies
them as two different formulas. An earlier version of this subgraph mirrored only the forward branch
and computed the scale from the two tokens' decimals, which is right for one direction and produces
a reference 10^24 out for the other. Every reverse-direction fill then scored -9999 bps, a number
that looks like a clamp and is really a scale error, and those scores were averaged into the daily
percentiles as if they were real.

Read by call rather than from `ReferenceFeedSet`, because the feeds are configured in the same
transaction that deploys the registry, which is before this subgraph's startBlock. Indexing the
event would leave every fill unscored instead.
"""
type ReferenceFeed @entity(immutable: false) @regularPolling {
  " `base` ++ `quote`, the ordered pair as the registry keys it "
  id: Bytes!
  " The token the recipient gives "
  base: Token!
  " The token the recipient receives "
  quote: Token!
  " The aggregator the registry reads for this pair "
  feed: Bytes!
  " Whether the registry inverts the feed answer for this direction "
  inverted: Boolean!
  " The registry's staleness bound for this pair, in seconds "
  stalenessBound: Int!
  " `1e18 * 10**quoteDecimals / 10**baseDecimals`, as the registry stored it "
  scale: BigInt!
}

"""
The most recent Chainlink answer this subgraph has seen, one row per aggregator.

Written by the aggregator data source, read when a fill is scored. It exists because a subgraph
cannot call `latestRoundData` for a historical block — the reference has to be indexed forward from
the feed's own events and the most recent one at or before the fill is the one that applies.

Note the address here is the **aggregator**, not the proxy. The proxy that everything else refers
to (`0x71041ddd...` on Base) emits nothing at all; verified by querying it and getting zero logs.
Chainlink can move a proxy to a new aggregator, and if that happens this data source stops
receiving updates silently — `FillQuality.referenceAgeSeconds` growing without bound is the symptom.
"""
type ReferenceAnswer @entity(immutable: false) @regularPolling {
  " The feed's identity, not its address: `ETH/USD`. Keying by address made every consumer carry one aggregator constant per network, and Base Sepolia silently scored nothing because it inherited mainnet's. The address is a field instead. "
  id: Bytes!
  " The aggregator that produced this answer "
  aggregator: Bytes!
  " Raw answer, at the feed's own decimals "
  answer: BigInt!
  " Feed-reported update time, which is what staleness is measured against "
  updatedAt: BigInt!
  roundId: BigInt!
  blockNumber: BigInt!
}

"""
The day's adverse-deviation samples, kept sorted so the snapshot's percentiles are an index rather
than a scan. Internal to the aggregation: consumers read ExecutionQualityDailySnapshot, never this.

It exists because a percentile is not incrementally computable from a running total the way a sum or
a count is, and the alternative — having every consumer page the day's fills and sort them client
side — is exactly the "report is a script that walks every fill" shape the daily report is meant to
replace.
"""
type ExecutionQualitySamples @entity(immutable: false) {
  " { Days since Unix epoch } "
  id: Bytes!
  " Adverse deviation in bps, ascending. Only scored fills appear: a fill with no reference behind it is excluded rather than averaged in at zero, which would drag every percentile toward the reference and make the floor look safer than the venue is. "
  deviationsBps: [Int!]!
  " Reference ages in seconds, ascending, for the snapshot's median. "
  referenceAgesSeconds: [Int!]!
}

"""
An address that ships strategies to the venue. Not the vault specifically: nothing upstream is
indexed, so every maker on Aqua arrives at the handlers and all of them are recorded. Narrowing to
one vault is a query, which is what makes this reusable by anyone building on the venue rather than
only by us.
"""
type Maker @entity(immutable: false) @regularPolling {
  " The maker address "
  id: Bytes!
  strategies: [Strategy!]! @derivedFrom(field: "maker")
  strategiesShipped: Int!
  strategiesActive: Int!
  firstSeenTimestamp: BigInt!
  lastUpdateTimestamp: BigInt!
}

"""
One shipped SwapVM program, decoded.

`Shipped` carries the whole program in its data blob, and the venue never decodes it — the VM reads
`[opcode][argsLen][args]` at execution time and nothing records what ran. Decoding it here is the one
piece of this index nobody else has, and it is what lets an interface say "quoting both sides,
decaying" instead of showing a user a hex blob.
"""
type Strategy @entity(immutable: false) @regularPolling {
  " maker ++ app ++ strategyHash "
  id: Bytes!
  maker: Maker!
  app: Bytes!
  strategyHash: Bytes!
  " The raw program, kept so anyone can re-decode it and check this one "
  program: Bytes!
  " True when the shipped blob was an ABI-encoded Order and the program came out of its data field. False when the maker shipped raw bytecode. Recorded rather than guessed, because the two shapes decode to completely different instructions. "
  programWrappedInOrder: Boolean!
  " Primary curve family, in the register an interface can show a person "
  classification: String!
  " Every curve family present, for a program running more than one "
  families: [String!]!
  steps: [StrategyStep!]! @derivedFrom(field: "strategy")
  stepCount: Int!
  " Empty when the program decoded cleanly. A truncated or malformed program is recorded with what was decoded and this set, rather than dropped. "
  decodeError: String!
  active: Boolean!
  shippedTimestamp: BigInt!
  shippedBlock: BigInt!
  dockedTimestamp: BigInt
  dockedBlock: BigInt
}

" One instruction of a decoded program, in program order. "
type StrategyStep @entity(immutable: true) {
  " strategy ++ index "
  id: Bytes!
  strategy: Strategy!
  index: Int!
  opcode: Int!
  " The VM's own name for the opcode, generated from OpcodeList.sol. `UNKNOWN` for an unallocated slot. "
  name: String!
  args: Bytes!
}
