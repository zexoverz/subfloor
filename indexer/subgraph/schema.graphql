############################
##### Event-Level Data #####
############################

"""
An event is any user action that occurs in a protocol. Generally, they are Ethereum events
emitted by a function in the smart contracts, stored in transaction receipts as event logs.
However, some user actions of interest are function calls that don't emit events. For example,
the deposit and withdraw functions in Yearn do not emit any events. In our subgraphs, we still
store them as events, although they are not technically Ethereum events emitted by smart
contracts.
"""
type Swap @entity(immutable: true) @transaction {
  " { Transaction hash }-{ Log index } "
  id: Bytes!

  " Transaction hash of the transaction that emitted this event "
  hash: Bytes!

  " Nonce of the transaction that emitted this event "
  nonce: BigInt!

  " Event log index. For transactions that don't emit event, create arbitrary index starting from 0 "
  logIndex: Int!

  " Gas used in this transaction. (Optional because not every chain will support this) "
  gasUsed: BigInt

  " Gas limit of the transaction that emitted this event "
  gasLimit: BigInt

  " Gas price of the transaction that emitted this event "
  gasPrice: BigInt

  " The protocol this transaction belongs to "
  protocol: DexAggProtocol!

  " Account that emitted this event "
  account: Account!

  " Block number of this event "
  blockNumber: BigInt!

  " Timestamp of this event "
  timestamp: BigInt!

  " Virtual Pool this swap occurred in "
  virtualPool: VirtualPool!

  " Tokens deposited into pool "
  tokensIn: [Token!]!

  " Amount of tokens deposited into pool in native units "
  amountsIn: [BigInt!]!

  " Amount of tokens deposited into pool in USD "
  amountsInUSD: [BigDecimal!]!

  " Tokens withdrawn from pool "
  tokensOut: [Token!]!

  " Amount of tokens withdrawn from pool in native units "
  amountsOut: [BigInt!]!

  " Amount of tokens withdrawn from pool in USD "
  amountsOutUSD: [BigDecimal!]!
}

# Helper entity for calculating daily/hourly active users
type ActiveAccount @entity(immutable: true) {
  " { daily/hourly }-{ Address of the account }-{ Days/hours since Unix epoch } "
  id: Bytes!
}

# ---------------------------------------------------------------------------------------------
# SUBFLOOR extensions
#
# Everything above this line is schema-dex-agg.graphql v1.0.2, unmodified. Everything below hangs
# off it by id and never edits it, so a consumer who knows the standard can query this subgraph
# without reading our docs, and a consumer who wants the floor data joins one hop.
#
# See docs/indexer-schema.md for why, and in particular for why Refusal cannot come from a handler.
# ---------------------------------------------------------------------------------------------

" The worst rate a recipient will accept for a pair, as currently configured on chain. "
type Floor @entity(immutable: false) @regularPolling {
  " { recipient }-{ base }-{ quote } "
  id: Bytes!

  " The party protected. Keyed to the recipient, never chosen per order by the caller. "
  recipient: Bytes!

  " The token this recipient gives. "
  base: Token!

  " The token this recipient receives. "
  quote: Token!

  " Max adverse deviation from the reference, in bps. 10000 means only the backstop binds. "
  maxAdverseBps: Int!

  " Absolute backstop rate, scaled 1e18, that binds even when the oracle is wrong. "
  absoluteRate: BigInt!

  " Block and timestamp of the most recent change. "
  updatedAtBlock: BigInt!
  updatedAt: BigInt!

  " Full history, so the floor-setting screen can show what was signed and when. "
  changes: [FloorChange!]! @derivedFrom(field: "floor")
}

enum FloorChangeKind {
  " Strengthened by the recipient itself. One call, no signature. "
  RAISED
  " Weakened under a guardian signature. The one high-risk action. "
  LOWERED
}

type FloorChange @entity(immutable: true) @transaction {
  " { Transaction hash }-{ Log index } "
  id: Bytes!
  floor: Floor!
  kind: FloorChangeKind!

  oldMaxAdverseBps: Int!
  newMaxAdverseBps: Int!
  oldAbsoluteRate: BigInt!
  newAbsoluteRate: BigInt!

  " Set only on a LOWERED change. Null on a raise, because a raise needs no signature. "
  guardian: Bytes

  hash: Bytes!
  blockNumber: BigInt!
  timestamp: BigInt!
}

" How good a fill actually was, scored against the same reference the floor is scored against. "
type FillQuality @entity(immutable: true) @transaction {
  " The Swap id, so this is a one-hop join from the standard entity. "
  id: Bytes!
  swap: Swap!

  " Realised rate, received * 1e18 / given, in the canonical convention. "
  executionRate: BigInt!

  " Chainlink reference at or before this block. "
  referencePrice: BigInt!

  """
  Age of that reference in seconds. A fill scored against a 20-minute-old reference is a weaker
  measurement than one scored against a 3-minute-old reference, and the daily report says so rather
  than averaging them together silently.
  """
  referenceAgeSeconds: Int!

  " Signed deviation from the reference in bps. Negative is worse than reference for the recipient. "
  adverseDeviationBps: Int!

  " The floor in force at this block, or null if the recipient had not configured one. "
  floorAtFill: BigInt

  blockNumber: BigInt!
  timestamp: BigInt!
}

"""
A fill the floor turned away.

Produced by the Substreams module, never by an event handler: SettledBelowFloor is a revert, and a
reverted transaction emits no logs at all. There is nothing for a subgraph handler to listen to.
This is the entity that makes the Substreams layer load-bearing rather than decorative.
"""
type Refusal @entity(immutable: true) @transaction {
  " { Transaction hash }-{ 0 } "
  id: Bytes!
  hash: Bytes!

  recipient: Bytes!
  base: Token!
  quote: Token!

  " What the fill would have settled at, decoded from the revert. "
  attemptedRate: BigInt!
  " What the recipient had signed for. "
  floorRate: BigInt!

  blockNumber: BigInt!
  timestamp: BigInt!
}

" Rolled up so the daily report is a query rather than a script that walks every fill. "
type ExecutionQualityDailySnapshot @entity(immutable: false) @dailySnapshot {
  " { Days since Unix epoch } "
  id: Bytes!
  protocol: DexAggProtocol!
  day: Int!

  fills: Int!
  refusals: Int!

  " Realised adverse deviation across the day's fills. The floor-setting screen reads these. "
  adverseDeviationP50Bps: Int!
  adverseDeviationP99Bps: Int!

  " Median age of the references used, so the report can say how fresh its own inputs were. "
  medianReferenceAgeSeconds: Int!

  timestamp: BigInt!
}

"""
The most recent Chainlink answer this subgraph has seen, one row per aggregator.

Written by the aggregator data source, read when a fill is scored. It exists because a subgraph
cannot call `latestRoundData` for a historical block — the reference has to be indexed forward from
the feed's own events and the most recent one at or before the fill is the one that applies.

Note the address here is the **aggregator**, not the proxy. The proxy that everything else refers
to (`0x71041ddd...` on Base) emits nothing at all; verified by querying it and getting zero logs.
Chainlink can move a proxy to a new aggregator, and if that happens this data source stops
receiving updates silently — `FillQuality.referenceAgeSeconds` growing without bound is the symptom.
"""
type ReferenceAnswer @entity(immutable: false) @regularPolling {
  " The aggregator address "
  id: Bytes!
  " Raw answer, at the feed's own decimals "
  answer: BigInt!
  " Feed-reported update time, which is what staleness is measured against "
  updatedAt: BigInt!
  roundId: BigInt!
  blockNumber: BigInt!
}
