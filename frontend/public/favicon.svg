<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The mark: a fill stops dead on the floor. Brass is the floor here exactly as it is everywhere
    else in the interface, and there is no red in it — red means refused.

    The ink follows the tab's theme, because a favicon drawn for warm paper is a smudge in a dark
    tab strip. The floor does not follow it: brass means one thing in both.
  -->
  <style>
    .ink { fill: #12161C; }
    @media (prefers-color-scheme: dark) { .ink { fill: #E5E9EF; } }
  </style>
  <path class="ink" d="M7 6l7.4 13.2h-3.6L4.8 8.6z"/>
  <path class="ink" d="M10.8 19.2h8.6l-1.6 3.4h-5.4z"/>
  <rect x="3" y="23" width="26" height="4.2" fill="#B57A1E"/>
</svg>
